# LearnCard PoC for EduCredential — Full stack with frontend
#
# Current use only with pre-built images. Next step add build sequence
#
# Usage:
#   docker compose up -d
#
# Frontend:  http://localhost:3000
# Brain API: http://localhost:4000/trpc  (Swagger: http://localhost:4000/docs)
# Cloud API: http://localhost:4100/trpc
# LCA API:   http://localhost:5100/trpc
# Neo4j:     http://localhost:7474
 
services:

  # ── Frontend ───────────────────────────────────────────────────
  traefik:
    image: "traefik:3.6"
    container_name: "traefik"
    command:
      # - "--log.level=DEBUG"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/docker/traefik-access.log"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=ber.kessels@surf.nl"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - 443:443
      - 80:80
    networks:
      - learn-card
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "/var/log/docker:/var/log/docker"
      - "./letsencrypt:/letsencrypt"

  app:
    image: welibrary/lcn-app
    build:
      context: .
      dockerfile: apps/learn-card-app/Dockerfile
    expose:
      - 3000
    depends_on:
      - brain
      - cloud
      - api
    networks:
      - learn-card
    extra_hosts:
      - "localhost:host-gateway"
    restart: unless-stopped
    environment:
      # These use actual URLs, not the docker-compose internal service names,
      # because the browser (not the container) makes these requests — they must
      # be reachable from the host
      LCN_URL: https://brain.poc17.eduwallet.nl/trpc
      LCN_API_URL: https://brain.poc17.eduwallet.nl/api
      CLOUD_URL: https://cloud.poc17.eduwallet.nl/trpc
      API_URL: https://api.poc17.eduwallet.nl/trpc
      APP_FULL_URL: https://frontend.poc17.eduwallet.nl
      WEB3AUTH_TESTNET_CLIENT_ID: "BI4pfLcbIIaVSRIAq7NXoI0CJAtsoLxqOdn-xmuOQM_wHK_tA6Qm_GvspdO9rC-a4jfuN7zoC-zjJWLAPGWKzrQ"

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`frontend.poc17.eduwallet.nl`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls.certresolver=myresolver"

  # ── Core application services ──────────────────────────────────

  brain:
    image: welibrary/lcn-brain-service
    ports:
      - "4000:4000"
    expose:
      - 4000
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_started
      elasticmq:
        condition: service_started
    networks:
      - learn-card
    extra_hosts:
      - "localhost:host-gateway"
    restart: unless-stopped
    environment:
      IS_OFFLINE: true
      PORT: 4000
      SEED: a
      DOMAIN_NAME: "brain.poc17.eduwallet.nl"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: this-is-the-password
      REDIS_URL: redis
      REDIS_PORT: 6379
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: notARealKey
      AWS_SECRET_ACCESS_KEY: notARealSecretKey
      NOTIFICATIONS_QUEUE_POLL_URL: http://elasticmq:9324/notifications
      NOTIFICATIONS_QUEUE_URL: http://elasticmq:9324/notifications
      SKILL_EMBEDDING_GOOGLE_API_KEY: ""
      SKILL_EMBEDDING_GOOGLE_MODEL: gemini-embedding-001
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.brain.rule=Host(`brain.poc17.eduwallet.nl`)"
      - "traefik.http.routers.brain.entrypoints=websecure"
      - "traefik.http.routers.brain.tls.certresolver=myresolver"

  cloud:
    image: welibrary/lcn-cloud-service
    ports:
      - "4100:4100"
    expose:
      - 4100
    depends_on:
      mongodb:
        condition: service_healthy
      redis2:
        condition: service_started
    networks:
      - learn-card
    extra_hosts:
      - "localhost:host-gateway"
    restart: unless-stopped
    environment:
      IS_OFFLINE: true
      PORT: 4100
      LEARN_CLOUD_SEED: b
      LEARN_CLOUD_MONGO_URI: "mongodb://mongodb:27017?ssl=false&replicaSet=rs0"
      LEARN_CLOUD_MONGO_DB_NAME: learn-cloud
      REDIS_URL: redis2
      REDIS_PORT: 6379
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cloud.rule=Host(`cloud.poc17.eduwallet.nl`)"
      - "traefik.http.routers.cloud.entrypoints=websecure"
      - "traefik.http.routers.cloud.tls.certresolver=myresolver"

  api:
    image: welibrary/lca-api-service
    build:
      context: .
      dockerfile: services/learn-card-network/lca-api/Dockerfile
    ports:
      - "5100:5100"
    expose:
      - 5100
    depends_on:
      mongodb:
        condition: service_healthy
      redis3:
        condition: service_started
    networks:
      - learn-card
    extra_hosts:
      - "localhost:host-gateway"
    restart: unless-stopped
    environment:
      IS_OFFLINE: true
      PORT: 5100
      SEED: c
      AUTHORIZED_DIDS: "did:web:brain.poc17.eduwallet.nl"
      MONGO_URI: "mongodb://mongodb:27017?ssl=false&replicaSet=rs0"
      MONGO_DB_NAME: lca-api
      REDIS_URL: redis3
      REDIS_PORT: 6379
      METABASE_SECRET_KEY: notARealSecretKey
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`lca.poc17.eduwallet.nl`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=myresolver"

  # ── Databases ──────────────────────────────────────────────────

  neo4j:
    image: neo4j:latest
    ports:
      - "7474:7474"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      NEO4J_AUTH: neo4j/this-is-the-password
      NEO4J_server_jvm_additional: --add-modules=jdk.incubator.vector
    networks:
      - learn-card
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.neo4j.rule=Host(`neo4j.poc17.eduwallet.nl`)"
      - "traefik.http.routers.neo4j.entrypoints=websecure"
      - "traefik.http.routers.neo4j.tls.certresolver=myresolver"

  mongodb:
    image: mongo:latest
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017", "--quiet", "--logpath", "/var/log/mongodb/mongod.log"]
    ports:
      - "27017:27017"
    expose:
      - 27017
    extra_hosts:
      - "localhost:host-gateway"
    healthcheck:
      test: >
        mongosh --host localhost --port 27017 --quiet --eval
        "try { rs.status().ok } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }"
      interval: 5s
      timeout: 30s
      start_period: 0s
      start_interval: 1s
      retries: 30
    networks:
      - learn-card
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: lrsql_user
      POSTGRES_PASSWORD: lrsql_password
      POSTGRES_DB: lrsql_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - learn-card
    restart: unless-stopped

  # ── Cache ──────────────────────────────────────────────────────

  redis:
    image: redis:alpine
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - REDIS_DISABLE_COMMANDS=FLUSHDB,FLUSHALL
    networks:
      - learn-card
    restart: unless-stopped

  redis2:
    image: redis:alpine
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - REDIS_DISABLE_COMMANDS=FLUSHDB,FLUSHALL
    networks:
      - learn-card
    restart: unless-stopped

  redis3:
    image: redis:alpine
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - REDIS_DISABLE_COMMANDS=FLUSHDB,FLUSHALL
    networks:
      - learn-card
    restart: unless-stopped

  # ── Queue ──────────────────────────────────────────────────────

  elasticmq:
    image: softwaremill/elasticmq-native
    expose:
      - 9324
    networks:
      - learn-card
    restart: unless-stopped

  # ── xAPI Learning Record Store ─────────────────────────────────

  lrs:
    image: yetanalytics/lrsql:latest
    command:
      - /lrsql/bin/run_postgres.sh
    depends_on:
      - postgres
    environment:
      LRSQL_API_KEY_DEFAULT: test-api-key
      LRSQL_API_SECRET_DEFAULT: test-api-secret
      LRSQL_ADMIN_USER_DEFAULT: test_username
      LRSQL_ADMIN_PASS_DEFAULT: test_password
      LRSQL_DB_HOST: postgres
      LRSQL_DB_NAME: lrsql_db
      LRSQL_DB_USER: lrsql_user
      LRSQL_DB_PASSWORD: lrsql_password
      LRSQL_POOL_INITIALIZATION_FAIL_TIMEOUT: 10000
      LRSQL_ALLOW_ALL_ORIGINS: true
    networks:
      - learn-card
    restart: unless-stopped

  # ── CLI (optional, for testing) ────────────────────────────────

  cli:
    image: node:20.10.0-bullseye-slim
    working_dir: /workspace
    stdin_open: true
    tty: true
    networks:
      - learn-card
    depends_on:
      - brain
      - cloud
      - api
    extra_hosts:
      - "localhost:host-gateway"
    entrypoint: ["bash"]

networks:
  learn-card:
    driver: bridge

volumes:
  pgdata:
